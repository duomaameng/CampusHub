name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  project-structure-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required directories
        run: |
          test -d backend
          test -d frontend
          test -d database
          test -d docs
          test -d scripts