server:
  port: 8080

spring:
  application:
    name: campus-hub
  datasource:
    url: jdbc:mysql://localhost:3306/campus_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

campus-hub:
  jwt:
    secret: ${JWT_SECRET:campus-hub-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration: 86400000
  mail:
    delivery-mode: ${MAIL_DELIVERY_MODE:smtp}
    from: ${MAIL_FROM:}
  file:
    upload-path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-file-size: 10485760

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
