spring:
  datasource:
    url: jdbc:h2:mem:campushub_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  mail:
    host: localhost
    port: 2525
    username:
    password:

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

campus-hub:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-tests
    expiration: 86400000
  mail:
    delivery-mode: log
    from: test@campushub.local
  file:
    upload-path: ./target/test-uploads
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-file-size: 10485760
