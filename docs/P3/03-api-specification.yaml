openapi: "3.0.3"
info:
  title: CampusHub API
  description: |
    校园互助服务平台 API 规范文档

    覆盖模块：认证与用户、需求与任务大厅、接单与订单、消息通知、评价与信用、举报、文件上传、后台管理
  version: "1.0.0"
  contact:
    name: 暴风星云裂
    url: https://gitee.com/duomaameng/campus-hub

servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
  - url: https://campushub.nju.edu.cn/api
    description: 生产环境

tags:
  - name: Auth
    description: 认证接口（注册、登录、邮箱验证、密码重置）
  - name: User
    description: 用户接口（个人资料、公开资料、评价记录）
  - name: Task
    description: 需求与任务大厅接口
  - name: Application
    description: 接单申请接口
  - name: Order
    description: 订单接口
  - name: Notification
    description: 通知接口
  - name: Message
    description: 订单聊天消息接口
  - name: Review
    description: 评价与信用接口
  - name: Report
    description: 举报接口
  - name: File
    description: 文件上传接口
  - name: Admin
    description: 后台管理接口
  - name: Announcement
    description: 公告接口

security:
  - bearerAuth: []

paths:
  # ==================== Auth ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      description: 使用学校邮箱注册账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, confirmPassword]
              properties:
                email:
                  type: string
                  format: email
                  example: student@smail.nju.edu.cn
                password:
                  type: string
                  minLength: 8
                  maxLength: 32
                  example: Abc123456!
                confirmPassword:
                  type: string
                  example: Abc123456!
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: 邮箱验证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 验证结果

  /auth/send-verification-code:
    post:
      tags: [Auth]
      summary: 发送验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  enum: [REGISTER, RESET_PASSWORD]

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses:
        "200":
          description: 已退出

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: 重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword, confirmNewPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 32
                confirmNewPassword:
                  type: string

  # ==================== User ====================
  /users/me:
    get:
      tags: [User]
      summary: 获取当前用户资料
      responses:
        "200":
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
    patch:
      tags: [User]
      summary: 修改个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 更新后的用户资料
    delete:
      tags: [User]
      summary: 注销账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string

  /users/{userId}/profile:
    get:
      tags: [User]
      summary: 获取用户公开资料
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 公开资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"

  /users/{userId}/reviews:
    get:
      tags: [User]
      summary: 获取用户评价记录
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 评价记录列表

  /users/{userId}/credit:
    get:
      tags: [User]
      summary: 获取用户信用信息
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 信用信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditInfoResponse"

  # ==================== Task ====================
  /tasks:
    get:
      tags: [Task]
      summary: 任务大厅列表
      description: 浏览公开需求，支持分类、校区、关键词筛选，按最新/截止时间排序
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TaskCategory"
        - name: campus
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索标题和描述
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, deadline]
            default: latest
        - name: status
          in: query
          schema:
            type: string
            default: OPEN
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      tags: [Task]
      summary: 发布需求
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: 发布成功

  /tasks/{taskId}:
    get:
      tags: [Task]
      summary: 需求详情
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: 需求详情
    patch:
      tags: [Task]
      summary: 编辑需求（仅发布者，且需求未接单）
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
    delete:
      tags: [Task]
      summary: 删除需求（仅发布者，且需求未接单）
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"

  /tasks/{taskId}/favorite:
    post:
      tags: [Task]
      summary: 收藏/取消收藏需求
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: 操作结果

  /tasks/favorites:
    get:
      tags: [Task]
      summary: 我的收藏列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"

  # ==================== Application ====================
  /tasks/{taskId}/applications:
    get:
      tags: [Application]
      summary: 查看需求的所有接单申请
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
    post:
      tags: [Application]
      summary: 发起接单申请
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"

  /applications/{applicationId}/confirm:
    post:
      tags: [Application]
      summary: 确认接单（发布者选择服务方，生成订单）
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  /applications/{applicationId}/reject:
    post:
      tags: [Application]
      summary: 拒绝接单申请
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string

  # ==================== Order ====================
  /orders:
    get:
      tags: [Order]
      summary: 我的订单列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: role
          in: query
          schema:
            type: string
            enum: [PUBLISHER, PROVIDER]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: keyword
          in: query
          schema:
            type: string

  /orders/{orderId}:
    get:
      tags: [Order]
      summary: 订单详情
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  /orders/{orderId}/complete:
    post:
      tags: [Order]
      summary: 服务方提交完成凭证
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proofImageId]
              properties:
                proofImageId:
                  type: integer
                  format: int64
                note:
                  type: string
                  maxLength: 500

  /orders/{orderId}/confirm-completion:
    post:
      tags: [Order]
      summary: 发布者确认完成
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  /orders/{orderId}/cancel:
    post:
      tags: [Order]
      summary: 取消订单
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string

  /orders/{orderId}/dispute:
    post:
      tags: [Order]
      summary: 发起争议
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                evidenceImageIds:
                  type: array
                  items:
                    type: integer
                    format: int64

  /orders/{orderId}/status-logs:
    get:
      tags: [Order]
      summary: 订单状态变更日志
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  # ==================== Notification ====================
  /notifications:
    get:
      tags: [Notification]
      summary: 通知列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: read
          in: query
          schema:
            type: boolean

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: 未读通知数量

  /notifications/read-all:
    patch:
      tags: [Notification]
      summary: 全部标记为已读

  /notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      summary: 标记通知为已读
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  /notifications/{notificationId}:
    delete:
      tags: [Notification]
      summary: 删除通知
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  # ==================== Message ====================
  /orders/{orderId}/messages:
    get:
      tags: [Message]
      summary: 订单聊天记录
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
    post:
      tags: [Message]
      summary: 发送文字消息
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageType, content]
              properties:
                messageType:
                  type: string
                  enum: [TEXT]
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000

  /orders/{orderId}/messages/image:
    post:
      tags: [Message]
      summary: 发送图片消息
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                content:
                  type: string

  # ==================== Review ====================
  /orders/{orderId}/reviews:
    get:
      tags: [Review]
      summary: 查看订单评价
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
    post:
      tags: [Review]
      summary: 提交评价
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                content:
                  type: string
                  maxLength: 500

  # ==================== Report ====================
  /reports:
    get:
      tags: [Report]
      summary: 我的举报列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
  /tasks/{taskId}/reports:
    post:
      tags: [Report]
      summary: 举报任务
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
                evidenceImageIds:
                  type: array
                  items:
                    type: integer
                    format: int64
  /users/{userId}/reports:
    post:
      tags: [Report]
      summary: 举报用户
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
                evidenceImageIds:
                  type: array
                  items:
                    type: integer
                    format: int64

  /reports/{reportId}:
    get:
      tags: [Report]
      summary: 举报详情
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  # ==================== File ====================
  /files/upload:
    post:
      tags: [File]
      summary: 上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, businessType]
              properties:
                file:
                  type: string
                  format: binary
                businessType:
                  type: string
                  enum: [AVATAR, TASK_IMAGE, ORDER_PROOF, CHAT_IMAGE, REPORT_EVIDENCE]

  # ==================== Admin ====================
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: 后台概览数据
      responses:
        "200":
          description: 概览数据

  /admin/users:
    get:
      tags: [Admin]
      summary: 用户管理列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: verified
          in: query
          schema:
            type: boolean

  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: 用户详情（管理员视角）
      parameters:
        - $ref: "#/components/parameters/UserIdPath"

  /admin/users/{userId}/status:
    patch:
      tags: [Admin]
      summary: 禁用/解禁用户
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/UserStatus"
                reason:
                  type: string

  /admin/tasks:
    get:
      tags: [Admin]
      summary: 需求管理列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TaskCategory"

  /admin/tasks/{taskId}/status:
    patch:
      tags: [Admin]
      summary: 下架/恢复需求
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CANCELLED]
                reason:
                  type: string

  /admin/orders:
    get:
      tags: [Admin]
      summary: 订单管理列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: keyword
          in: query
          schema:
            type: string

  /admin/orders/{orderId}/status:
    patch:
      tags: [Admin]
      summary: 冻结/恢复订单
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [CANCELLED]
                reason:
                  type: string

  /admin/reports:
    get:
      tags: [Admin]
      summary: 举报管理列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"

  /admin/reports/{reportId}:
    patch:
      tags: [Admin]
      summary: 处理举报
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, result]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                result:
                  type: string
                  minLength: 1
                  maxLength: 500
                penalties:
                  type: array
                  items:
                    type: string
                    enum: [REMOVE_TASK, WARN_USER, DISABLE_USER, DEDUCT_CREDIT]

  /admin/announcements:
    get:
      tags: [Announcement]
      summary: 公告列表（管理端）
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
    post:
      tags: [Announcement]
      summary: 发布公告
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
                priority:
                  type: string
                  enum: [NORMAL, IMPORTANT]
                  default: NORMAL

  /admin/announcements/{announcementId}:
    patch:
      tags: [Announcement]
      summary: 编辑公告
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 5000
                priority:
                  type: string
                  enum: [NORMAL, IMPORTANT]
    delete:
      tags: [Announcement]
      summary: 删除公告
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
            format: int64

  /announcements:
    get:
      tags: [Announcement]
      summary: 前台公告列表
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    # ---- Enums ----
    UserRole:
      type: string
      enum: [STUDENT, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED, ANONYMIZED]
    TaskCategory:
      type: string
      enum: [EXPRESS, ERRAND, TUTORING, SECOND_HAND, LOST_FOUND, CONSULTATION, TEAM_UP, OTHER]
    TaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED, EXPIRED]
    ApplicationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    OrderStatus:
      type: string
      enum: [PENDING_CONFIRM, IN_PROGRESS, PENDING_COMPLETION, COMPLETED, CANCELLED, TIMEOUT, DISPUTE, REVIEWED]
    RewardType:
      type: string
      enum: [CASH, NEGOTIABLE, CREDIT_INTENT]
    ReportTargetType:
      type: string
      enum: [TASK, ORDER_MESSAGE, REVIEW, USER]
    ReportReasonType:
      type: string
      enum: [FRAUD, ABUSE, SPAM, ILLEGAL, TIMEOUT, OTHER]
    ReportStatus:
      type: string
      enum: [PENDING, PROCESSING, RESOLVED, REJECTED]
    MessageType:
      type: string
      enum: [TEXT, IMAGE]
    NotificationType:
      type: string
      enum: [APPLICATION, ORDER_STATUS, ORDER_MESSAGE, REVIEW_REQUEST, REPORT_RESULT]

    # ---- Common ----
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object

    PageInfo:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer

    # ---- Auth ----
    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
                email:
                  type: string

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                tokenType:
                  type: string
                expiresIn:
                  type: integer
                user:
                  $ref: "#/components/schemas/LoginUser"

    LoginUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        verified:
          type: boolean
        nickname:
          type: string
        avatarUrl:
          type: string

    # ---- User ----
    UserProfileResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        verified:
          type: boolean
        profile:
          $ref: "#/components/schemas/ProfileDetail"
        credit:
          $ref: "#/components/schemas/CreditSummary"
        createdAt:
          type: string
          format: date-time

    ProfileDetail:
      type: object
      properties:
        nickname:
          type: string
        avatarUrl:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        grade:
          type: string
        college:
          type: string
        bio:
          type: string
          maxLength: 200
        campus:
          type: string
        contact:
          type: string
        contactVisible:
          type: boolean

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
        avatarUrl:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        grade:
          type: string
        college:
          type: string
        bio:
          type: string
          maxLength: 200
        campus:
          type: string
        contact:
          type: string
        contactVisible:
          type: boolean

    PublicProfileResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
                nickname:
                  type: string
                avatarUrl:
                  type: string
                gender:
                  type: string
                college:
                  type: string
                campus:
                  type: string
                verified:
                  type: boolean
                contact:
                  type: string
                  nullable: true
                contactVisible:
                  type: boolean
                creditScore:
                  type: integer
                completedOrders:
                  type: integer
                praiseRate:
                  type: number
                memberSince:
                  type: string
                  format: date

    CreditSummary:
      type: object
      properties:
        score:
          type: integer
        completedOrders:
          type: integer
        praiseRate:
          type: number

    CreditInfoResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
                score:
                  type: integer
                completedOrders:
                  type: integer
                praiseRate:
                  type: number
                recentReviews:
                  type: array
                  items:
                    $ref: "#/components/schemas/ReviewItem"

    ReviewItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        reviewerNickname:
          type: string
        rating:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    # ---- Task ----
    CreateTaskRequest:
      type: object
      required: [category, title, description, campus, rewardType, deadline]
      properties:
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 2000
        campus:
          type: string
          maxLength: 50
        rewardType:
          $ref: "#/components/schemas/RewardType"
        deadline:
          type: string
          format: date-time
        anonymous:
          type: boolean
          default: false
        imageIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 9
        categoryFields:
          $ref: "#/components/schemas/CategoryFields"

    CategoryFields:
      type: object
      properties:
        # EXPRESS
        expressCompany:
          type: string
        pickupLocation:
          type: string
        pickupCode:
          type: string
        deliveryLocation:
          type: string
        # SECOND_HAND
        goodsCategory:
          type: string
        condition:
          type: string
          enum: [NEW, LIKE_NEW, USED]
        price:
          type: number
        # LOST_FOUND
        itemName:
          type: string
        location:
          type: string
        foundTime:
          type: string
          format: date-time
        itemDescription:
          type: string
        contactInfo:
          type: string
        # TEAM_UP
        activityType:
          type: string
        requiredCount:
          type: integer
        activityTime:
          type: string
          format: date-time

    TaskListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageInfo"
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: "#/components/schemas/TaskListItem"

    TaskListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publisherId:
          type: integer
          format: int64
        publisherNickname:
          type: string
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
        description:
          type: string
        campus:
          type: string
        rewardType:
          $ref: "#/components/schemas/RewardType"
        deadline:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TaskStatus"
        anonymous:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string
        applicationCount:
          type: integer
        favoriteCount:
          type: integer
        isFavorited:
          type: boolean
        categoryFields:
          $ref: "#/components/schemas/CategoryFields"
        privateFieldsHidden:
          type: boolean
          description: 未确认接单时，响应是否已隐藏取件码、精确送达地点或联系方式等私密字段
        createdAt:
          type: string
          format: date-time
